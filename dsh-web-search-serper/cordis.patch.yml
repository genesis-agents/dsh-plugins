# dsh-web-search bundle patch.
#
# Two rows. The first points `ctx.web` at this provider by id — the seam reads
# that id once when the service is constructed, so it is composition config
# rather than a setting. The second inserts the plugin itself.
#
# `name` is the module specifier the Loader imports, so it is the PACKAGE's
# name, not the directory's. The directory kept `-serper` from when Serper was
# the only backend; the package did not, and a mismatch here fails at mount
# with "cannot find package" after installing perfectly.
- id: web
  config:
    searchProvider: multi
- insert:
    - id: web-search
      name: '@ai4gensteam/dsh-web-search'
