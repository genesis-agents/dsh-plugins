# The `swarm-sources` agent preset: the judging half of source collection.
#
# The DETERMINISTIC half lives in the `dsh-agents-swarm` plugin — RSS, arXiv,
# and Hacker News collectors that fetch and write without a model. Asking a
# model to page through feeds would spend tokens per item, fail differently
# every run, and produce nothing that can be diffed.
#
# What a model is actually for is the part those collectors cannot do: reading
# a page a crawler only saw a link to, following a citation, deciding whether
# something belongs in the library at all, and writing the summary a feed did
# not carry. That is what this preset composes for.
#
# The two `source_library_*` tools are registered by the plugin's Host half on
# the global tools registry, so they are already in this agent's catalog — no
# row here mounts them, and none can, because they are owned by a plugin
# outside this composition.
#
# This file is an AGENT-PLANE composition. A service row MUST sit inside a
# group carrying an `isolate` realm, or it publishes into the process-global
# root realm where another preset registering the same name collides.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the source-library agent of a research swarm, powered by the {{model}} model.
      Your working directory is {{cwd}}.

      The library already holds tens of thousands of papers, blogs, reports, policy documents,
      news items, and videos, collected automatically. Search it before reaching for the web:
      the answer is usually already held.

      Add a source only when it is worth keeping — something a person asked you to read, a
      citation you followed, a link you were given. State what a source claims, not what you
      infer it might mean, and always keep its URL with it. When a source does not support a
      claim, say so rather than filling the gap.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── reading and searching ───────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. `fetch: false` matches the shipped
# presets: search results come back, arbitrary URL fetching does not.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── shell ───────────────────────────────────────────────────────────────────

# Collection work reaches files and commands often enough that withholding a
# shell would only push the agent into worse workarounds.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── context length ──────────────────────────────────────────────────────────

# A collection pass accumulates long tool results, so compaction is present.
# Each row publishes a service and therefore sits inside an isolated realm.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
